name: CI

on:
  push:
    branches: [master]
  pull_request:

# 取消同一 ref 上仍在跑的舊 workflow，省 runner 時間
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # 釘住 gitleaks 版本；升版時一併更新此處（需 ≥8.19，才有 `gitleaks git` 子命令）
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout（含完整歷史，gitleaks git 需要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks（釘版本 + 對官方 checksums 驗證）
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # 以資產原始檔名下載：sha256sum -c 會用 checksums 內的檔名比對，故不可改名
          curl -sSLf -o "$asset" "${base}/${asset}"
          curl -sSLf -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version

      - name: Run gitleaks（與本機 hook 共用 .gitleaks.toml）
        run: ./gitleaks git --redact -c .gitleaks.toml

  verify:
    name: Test / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build
